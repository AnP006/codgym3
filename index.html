<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên kết yêu thích</title>
</head>
<body>
    <h1>Liên kết yêu thích của tôi</h1>

    <ul>
        <!-- Liên kết dẫn đến trang web khác, mở trong tab mới -->
        <li>
            <a href="https://www.google.com" target="_blank">Google Tìm Kiếm (Mở tab mới)</a>
        </li>
        <li>
            <a href="https://github.com" target="_blank">GitHub (Mở tab mới)</a>
        </li>
        <li>
            <a href="https://developer.mozilla.org" target="_blank">MDN Web Docs (Mở tab mới)</a>
        </li>

        <!-- Liên kết đến file HTML khác trong cùng thư mục -->
        <li>
            <a href="about.html">Trang giới thiệu về tôi (about.html)</a>
        </li>

        <!-- Liên kết đến email -->
        <li>
            <a href="mailto:example@gmail.com">Gửi email cho tôi</a>
        </li>
    </ul>
</body>
</html>
